name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı release APK + AAB de üret (keystore secret'ları gerekir)"
        type: boolean
        default: false

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3      # SDK + lisans onayı

      - uses: gradle/actions/setup-gradle@v4        # wrapper gerekmez, Gradle'ı kendisi kurar
        with:
          gradle-version: "8.9"

      - name: Gizli anahtarları local.properties'e yaz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          AD_BANNER: ${{ secrets.AD_BANNER }}
          AD_INTERSTITIAL: ${{ secrets.AD_INTERSTITIAL }}
          AD_REWARDED: ${{ secrets.AD_REWARDED }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          for v in GEMINI_API_KEY PROXY_URL PROXY_TOKEN ADMOB_APP_ID AD_BANNER AD_INTERSTITIAL AD_REWARDED; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v=$val" >> local.properties; fi
          done

      - name: Derle (debug)
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CalorieAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release APK + AAB
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gizli anahtarları local.properties'e yaz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          AD_BANNER: ${{ secrets.AD_BANNER }}
          AD_INTERSTITIAL: ${{ secrets.AD_INTERSTITIAL }}
          AD_REWARDED: ${{ secrets.AD_REWARDED }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          for v in GEMINI_API_KEY PROXY_URL PROXY_TOKEN ADMOB_APP_ID AD_BANNER AD_INTERSTITIAL AD_REWARDED; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v=$val" >> local.properties; fi
          done

      - name: Keystore'u çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Derle (release)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CalorieAI-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
